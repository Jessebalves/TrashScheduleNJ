<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B1F1D">
<title>TrashScheduleNJ - Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<!--Browser tab icon: a wastebin-->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--The "Site design: New | Classic" bar, shared with the classic pages. data-home: this is
    the site's landing page, a visitor who picked Classic is sent on to classic/-->
<script src="design-switch.js" data-ui="new" data-home></script>
</head>
<body data-page="home">
<a class="skip-link" href="#main">Skip to content</a>
<noscript><p style="padding:16px">This page needs JavaScript. The <a href="classic/">classic design</a> is also available.</p></noscript>
<!--The header, menus and footer are added by app.js-->
<main id="main">
    <h1 class="visually-hidden">Your trash and recycling pickups</h1>
    <!--Left column on desktop. On a phone all cards are one list, see the o- classes in app.css-->
    <div class="col">
        <section class="next o-next" id="next" aria-labelledby="next-title"></section>
        <div class="notice o-holiday" id="holiday" role="status" hidden></div>
        <section class="card card-pad o-notes" id="notes" hidden></section>
        <section class="which o-bin" id="which"></section>
    </div>
    <!--Right column on desktop-->
    <div class="col">
        <section class="coming o-coming" id="coming" aria-labelledby="coming-title" hidden>
            <div class="section-head">
                <h2 class="card-title" id="coming-title">Coming up</h2>
                <a href="calendar.html">See calendar</a>
            </div>
            <div class="card"><ul class="pickup-list" id="coming-list"></ul></div>
        </section>
        <section class="card remind o-remind" id="remind" aria-label="Reminders"></section>
        <!--Desktop only on the home page, the Calendar page has it on phones-->
        <section class="card addcal o-cal desktop-only" id="addcal" hidden></section>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
