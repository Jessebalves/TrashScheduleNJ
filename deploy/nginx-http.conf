# Installed by install.sh when no TLS certificate is present yet.
# Add the certificate and key, then run install.sh again to switch to HTTPS.
server {
    listen 80 default_server;
    server_name @SERVER_NAME@;

    root @WEB_ROOT@;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /data {
        proxy_pass http://127.0.0.1:5000/data;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
