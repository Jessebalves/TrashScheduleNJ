# Installed by install.sh when the TLS certificate and key are present.
server {
    listen 443 ssl;
    ssl_certificate @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    server_name @SERVER_NAME@;

    root @WEB_ROOT@;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The classic design moved to /classic/ on 2026-11-18. Old links keep working
    location = /about.html   { return 301 /classic/about.html; }
    location = /contact.html { return 301 /classic/contact.html; }
    location = /classic.html { return 301 /classic/; }

    # The new design was under /new/ before it moved to the root on 2026-11-18
    location = /new/index.html { return 301 /; }
    location ^~ /new/ {
        rewrite ^/new/(.*)$ /$1 permanent;
    }

    # Requests the Python server answers: /data (one address) and /config (page settings)
    location ~ ^/(data|config)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name @SERVER_NAME@;
    return 302 https://$host$request_uri;
}
